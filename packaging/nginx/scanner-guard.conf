# Scanner Guard: attack rules. Created by `scanner-guard-agent nginx-init` and
# yours to edit, the agent never overwrites it.
#
# This file is loaded in the http context (conf.d). Nothing is blocked until a
# server block also has:  include scanner-guard/server.conf;
#
# After every change:
#   scanner-guard-agent nginx-test /var/log/nginx/access.log   # what would be blocked
#   nginx -t && systemctl reload nginx
#
# The value of each line is the rule name, shown in the log and by nginx-test.
# Comment a line out to disable it. In the rules:
#   (?:%[0-9a-f][0-9a-f]|[^\w=&%-]) is "any separator": + %20 %0a /**/ ( ...
#   Keep the {1,40} limits: an unbounded repeat lets a crafted URL burn CPU.
#   Stick to syntax without lookaheads, so nginx-test can run the rule too.

# 1. Exceptions: paths that are never blocked, e.g. a search page or an admin
#    that legitimately receives SQL or HTML. Matched on the decoded path.
map $uri $sg_skip {
    default 0;
    # "~^/admin/reports/" 1;
    # "/search.php" 1;
}

# 2. Rules on the raw request URI (path and query string), first match wins.
map $request_uri $sg_uri {
    default "";

    # --- SQL injection ---
    # UNION SELECT, UNION ALL SELECT, UNION/**/SELECT, /*!50000UNION*/ ...
    "~*union(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,40}(?:(?:all|distinct)(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,40})?[0-9]{0,6}select" sqli-union;
    # ' or 1=1, ' and 'a'='a, ') or 1--, " or ""="
    "~*(?:'|%27|\"|%22)(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){0,40}x?(?:or|and)(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,40}\w{0,20}(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){0,40}(?:=|%3d|<|%3c|>|%3e|--|%23|like)" sqli-quote;
    # id=1 and 1=1, id=-1 or 2>1
    "~*=-?[0-9]{1,20}(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,40}x?(?:or|and)(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,40}[0-9]{1,20}(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){0,40}(?:=|%3d|<|%3c|>|%3e)" sqli-number;
    # id=1 order by 10 (counting columns)
    "~*=-?[0-9]{1,20}(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,40}order(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,40}by(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,40}[0-9]" sqli-orderby;
    # sleep(5), benchmark(...), load_file('...'), extractvalue(1,...)
    "~*(?:sleep|benchmark|load_file|extractvalue|updatexml)(?:\(|%28)(?:%[0-9a-f][0-9a-f]|[0-9'\"(])" sqli-function;
    "~*waitfor(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,40}delay" sqli-function;
    "~*into(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,40}(?:out|dump)file" sqli-file;
    "~*from(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,40}(?:information_schema|sysobjects|syscolumns)" sqli-schema;

    # --- Reading files: ../../, /etc/passwd, null byte, php://filter ---
    "~*(?:(?:\.|%2e|%252e){2}(?:/|\\\\|%2f|%5c|%252f|%255c)){2}" traversal;
    "~*(?:/|%2f)(?:etc(?:/|%2f)(?:passwd|shadow|hosts|issue)|proc(?:/|%2f)(?:self|version)|boot\.ini|win\.ini)" lfi;
    "~%00" nullbyte;
    "~*=(?:php|phar|expect|zip|glob|data|input|compress\.(?:zlib|bzip2))(?::|%3a)(?:(?:/|%2f){2}|text(?:/|%2f)|;|%3b|,)" wrapper;

    # --- Running code ---
    # PHP settings through the query string (CVE-2012-1823, CVE-2024-4577)
    "~*(?:allow_url_include|auto_prepend_file|auto_append_file|disable_functions|open_basedir)(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){0,10}(?:=|%3d)" phpini;
    # ;wget http://..., |cat /etc/..., $(whoami)
    "~*(?:;|%3b|\||%7c|`|%60|\(|%28|&|%26|%0a)(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){0,10}(?:cat(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,10}(?:etc|proc|var|home)(?:/|%2f)|(?:wget|curl)(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,10}(?:-|https?|ftp)|whoami|uname(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,10}-|(?:ba)?sh(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){1,10}-[ci])" command;
    "~*(?:[^a-z]|%[0-9a-f][0-9a-f])(?:eval|assert|system|exec|shell_exec|passthru|popen|proc_open|phpinfo|base64_decode|file_put_contents|file_get_contents|call_user_func(?:_array)?|create_function)(?:\(|%28)" code;
    # serialized PHP object: O:8:"stdClass"
    "~*(?:=|;|%3b|\{|%7b)o(?::|%3a)[0-9]{1,4}(?::|%3a)(?:%22|\")" object;
    "~*[?&](?:GLOBALS|_(?:GET|POST|REQUEST|SERVER|COOKIE|SESSION|FILES|ENV))(?:=|\[|%5b)" globals;
    "~*(?:[$]|%24)(?:\{|%7b)(?:jndi|lower|upper|env)(?::|%3a)" jndi;

    # --- XSS ---
    "~*(?:<|%3c)(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){0,5}(?:script|iframe|svg|embed|applet)(?:(?:%[0-9a-f][0-9a-f]|[^\w=&%-])|=|&|$)" xss;
    "~*(?:<|%3c)[^&]{1,100}on(?:error|load|mouseover|click|focus|toggle)(?:%[0-9a-f][0-9a-f]|[^\w=&%-]){0,10}(?:=|%3d)" xss;
    "~*=(?:java|vb)script(?::|%3a)" xss;

    # --- Strict, off by default: check with nginx-test before enabling ---
    # A percent-encoded letter (%55NION). Browsers don't send these, some API clients do.
    # "~*%(?:4[1-9a-f]|5[0-9a]|6[1-9a-f]|7[0-9a])" encoded;
    # A full URL in a parameter (remote file inclusion). Also matches redirect/callback URLs.
    # "~*=(?:https?|ftp)(?::|%3a)(?:/|%2f){2}" rfi;
}

# 3. Rules on the decoded path, first match wins.
map $uri $sg_path {
    default "";

    # .env, .git/config, .htpasswd ...
    "~*/\.(?:env|git|svn|hg|bzr|ht(?:access|passwd)|aws|ssh|docker|idea|vscode|DS_Store|npmrc|s3cfg|bash_history|mysql_history)" dotfile;
    # dump.sql, config.php.bak, index.php~, backup.zip
    "~*\.(?:sql|sqlite3?|bak|old|orig|swp|swo|dump)(?:\.(?:gz|bz2|zip|xz))?$" backup;
    "~*\.(?:php[0-9]?|inc|conf(?:ig)?|ini|ya?ml)(?:~|\.(?:txt|save|dist|zip|gz|tar|[0-9]))$" backup;
    "~*/(?:backup|dump|database|db|site|www|public_html|htdocs)\.(?:zip|rar|7z|tar|tgz|tar\.gz|gz)$" backup;
    "~*/(?:composer\.(?:json|lock|phar)|package-lock\.json|phpunit\.xml(?:\.dist)?|web\.config|docker-compose\.ya?ml|Dockerfile|Vagrantfile|wp-config\.php)$" config;
    # web shells and exposed tools
    "~*/vendor/(?:.{0,100}/)?phpunit/" probe;
    "~*/(?:eval-stdin|phpinfo|adminer[^/]{0,20}|c99|r57|wso[0-9]{0,4}|b374k|alfa(?:new|cgi)?|shell)\.php$" probe;
    # PHP in a directory meant for data. Add your own upload directories.
    "~*/(?:uploads|tmp|temp|cache)/.{0,200}\.(?:php[0-9]?|phtml|phar|pht)(?:/|$)" upload-php;

    # Off by default: only for sites that are NOT WordPress/Joomla and have no phpMyAdmin.
    # "~*/(?:wp-(?:login|admin|content|includes|json)|xmlrpc\.php|administrator/|phpmyadmin|pma/)" cms;
}

# 4. Rules on the User-Agent.
map $http_user_agent $sg_agent {
    default "";
    "~*(?:sqlmap|nikto|nmap|masscan|zgrab|nuclei|acunetix|netsparker|nessus|openvas|w3af|havij|dirbuster|gobuster|feroxbuster|ffuf|wfuzz|wpscan|whatweb|commix)" scanner;
    "~\(\) ?\{" shellshock;
    "~*[$]\{.{0,20}jndi" jndi;
    # Off by default: no User-Agent at all. Also blocks some monitors and webhooks.
    # "" empty-agent;
}

# The first of the three that matched, and no exception: blocked.
map $sg_path $sg_path_or_agent {
    default $sg_path;
    "" $sg_agent;
}
map $sg_uri $sg_rule {
    default $sg_uri;
    "" $sg_path_or_agent;
}
map "$sg_skip:$sg_rule" $sg_block {
    default 0;
    "~^0:." 1;
}

log_format scanner_guard '$remote_addr - [$time_local] "$request" $status rule=$sg_rule host=$host "$http_user_agent"';

# 5. Login brute force, used by `include scanner-guard/login.conf;`. Only POSTs to
#    these paths are counted, per client. Adjust the paths and the rate.
map "$request_method:$request_uri" $sg_login {
    default "";
    "~*^POST:/(?:[^?]{0,100}/)?(?:login|logon|signin|entrar|autenticar?|wp-login|xmlrpc)(?:\.php)?(?:[/?]|$)" $binary_remote_addr;
}
limit_req_zone $sg_login zone=sg_login:10m rate=10r/m;
