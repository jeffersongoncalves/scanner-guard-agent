# Scanner Guard: slows down login brute force (429 above the rate). Optional, add
# to the server block, before its own if/rewrite/return lines:
#   include scanner-guard/login.conf;
#
# Paths and rate: conf.d/scanner-guard-rules.conf. A location with its own limit_req
# doesn't inherit this one, repeat the include there.
# Behind a proxy or CDN, restore the client IP first (nginx-init -proxy), or every
# visitor shares one limit.

# Evaluates $sg_login now: after a rewrite, $uri would be the front controller.
set $sg_login_key $sg_login;

limit_req zone=sg_login burst=10 nodelay;
limit_req_status 429;
