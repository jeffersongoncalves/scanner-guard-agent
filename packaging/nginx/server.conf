# Scanner Guard: answers 403 to the requests matched by conf.d/scanner-guard-rules.conf.
# Add to every server block to protect, before its own if/rewrite/return lines:
#   include scanner-guard/server.conf;

if ($sg_block) {
    rewrite ^ /.scanner-guard-blocked last;
}

# A location of its own: blocked requests get their own log without touching the
# access_log of the site.
location = /.scanner-guard-blocked {
    internal;
    access_log /var/log/nginx/scanner-guard.log scanner_guard;
    error_page 599 /; # drops an inherited error_page 403, which would skip this log
    return 403;
}
